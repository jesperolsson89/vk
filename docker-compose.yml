services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vk
      BANKID_CERT_PATH: /certs/bankid.p12
      BANKID_CERT_PASSPHRASE: ${BANKID_CERT_PASSPHRASE}
      BANKID_CA_PATH: /certs/bankid-ca.crt
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
    volumes:
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: