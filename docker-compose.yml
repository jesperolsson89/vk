services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter web dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_api_node_modules:/app/apps/api/node_modules
      - web_db_node_modules:/app/packages/db/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    depends_on:
      api:
        condition: service_healthy
  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter api dev"
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vk
      BANKID_CERT_PATH: /certs/bankid.p12
      BANKID_CERT_PASSPHRASE: ${BANKID_CERT_PASSPHRASE}
      BANKID_CA_PATH: /certs/bankid-ca.crt
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: development
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - api_db_node_modules:/app/packages/db/node_modules
      - api_web_node_modules:/app/apps/web/node_modules
      - ./certs:/certs:ro
      - pnpm_store:/root/.local/share/pnpm/store
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  web_node_modules:
  web_app_node_modules:
  api_node_modules:
  api_app_node_modules:
  api_db_node_modules:
  web_api_node_modules:
  web_db_node_modules:
  api_web_node_modules:
  pnpm_store:  